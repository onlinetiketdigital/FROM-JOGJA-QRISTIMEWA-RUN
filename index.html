<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOGJA QRIStimewa RUN 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

/* ===== FIX + CLEAN RACING BACKGROUND ===== */
body{
background:
repeating-linear-gradient(-45deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 2px, transparent 2px, transparent 26px),
linear-gradient(135deg,#02141c,#003c4a,#00b894);
min-height:100vh;
overflow-x:hidden;
color:white;
position:relative;
}

/* glow effect */
body::before{
content:'';
position:fixed;
width:600px;height:600px;
background:radial-gradient(circle,#00e5ff33,transparent);
top:-200px;left:-200px;
z-index:-1;
}

body::after{
content:'';
position:fixed;
width:600px;height:600px;
background:radial-gradient(circle,#00ffae22,transparent);
bottom:-200px;right:-200px;
z-index:-1;
}

/* ===== ORIGINAL STRUCTURE (TIDAK DIUBAH) ===== */

.container{
width:95%;
max-width:960px;
margin:25px auto;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(18px);
border-radius:34px;
overflow:hidden;
border:1px solid rgba(255,255,255,0.12);
}

.header{
background:linear-gradient(135deg,#00e5ff,#0066ff,#02142c);
padding:38px 25px;
text-align:center;
}

.header h1{
font-family:'Orbitron';
font-size:32px;
font-weight:900;
}

.timer-box{
margin-top:20px;
padding:12px;
border-radius:12px;
background:rgba(255,255,255,0.2);
}

.page{display:none;padding:30px;}
.page.active{display:block;}

.banner{width:100%;border-radius:20px;margin-bottom:20px;}

.input-group{margin-bottom:18px;}
.input-group input,
.input-group textarea,
.input-group select{
width:100%;
padding:14px;
border-radius:12px;
border:none;
background:rgba(255,255,255,0.12);
color:white;
}

.category-card{
padding:20px;
border-radius:18px;
background:rgba(255,255,255,0.08);
cursor:pointer;
margin-bottom:10px;
}
.category-card.active{border:2px solid #00e5ff;}

.button-group{display:flex;gap:10px;margin-top:20px;}
button{flex:1;padding:14px;border:none;border-radius:12px;font-weight:700;}
.btn-next{background:linear-gradient(90deg,#00e5ff,#0066ff);color:white;}
.btn-back{background:#555;color:white;}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>JOGJA QRIStimewa RUN 2026</h1>
<div class="timer-box">Sisa Waktu: <span id="countdown">10:00</span></div>
</div>

<!-- PAGE 1 -->
<div class="page active" id="page1">

<img src="banner.png" class="banner">

<div class="input-group"><input placeholder="Nama" id="nama"></div>
<div class="input-group"><input placeholder="Email" id="email"></div>

<div class="button-group">
<button class="btn-next" onclick="showPage(2)">LANJUT</button>
</div>

</div>

<!-- PAGE 2 -->
<div class="page" id="page2">

<div class="category-card" onclick="selectCat(this)">5K</div>
<div class="category-card" onclick="selectCat(this)">10K</div>

<img src="size-chart.jpg" class="banner">

<div class="button-group">
<button class="btn-back" onclick="showPage(1)">Kembali</button>
<button class="btn-next" onclick="showPage(3)">Bayar</button>
</div>

</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
<img src="qris-bayar.png" class="banner">
</div>

</div>

<script>
function showPage(p){
document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
document.getElementById('page'+p).classList.add('active');
}

function selectCat(el){
document.querySelectorAll('.category-card').forEach(e=>e.classList.remove('active'));
el.classList.add('active');
}

let t=600;
setInterval(()=>{
let m=Math.floor(t/60);
let s=t%60;
document.getElementById('countdown').innerHTML =
m+":"+(s<10?"0":"")+s;
t--;
},1000);
</script>

</body>
</html>

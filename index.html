<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOGJA QRIStimewa RUN 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

/* ===== THEME EVENT SPORT ===== */

body{
background:
radial-gradient(circle at 20% 30%, #00e5ff22, transparent),
radial-gradient(circle at 80% 70%, #00ffae22, transparent),
linear-gradient(135deg,#02141c,#003b4a,#00b894);

min-height:100vh;
color:white;
overflow-x:hidden;
}

/* ===== CONTAINER ===== */

.container{
width:95%;
max-width:960px;
margin:25px auto;
background:rgba(255,255,255,0.07);
backdrop-filter:blur(18px);
border-radius:28px;
border:1px solid rgba(255,255,255,0.15);
box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

/* ===== HEADER ===== */

.header{
background:linear-gradient(135deg,#00e5ff,#0077ff,#001f3f);
padding:35px;
text-align:center;
}

.header h1{
font-family:'Orbitron';
font-size:32px;
}

.timer-box{
margin-top:15px;
padding:10px;
background:rgba(255,255,255,0.2);
border-radius:12px;
}

/* ===== PAGE ===== */

.page{
display:none;
padding:28px;
}

.page.active{
display:block;
}

/* ===== INPUT ===== */

.input-group{
margin-bottom:18px;
}

.input-group label{
display:block;
margin-bottom:6px;
font-weight:600;
}

.input-group input,
.input-group textarea,
.input-group select{
width:100%;
padding:14px;
border-radius:12px;
border:none;
background:rgba(255,255,255,0.12);
color:white;
}

.input-group input:focus,
.input-group textarea:focus,
.input-group select:focus{
outline:none;
border:1px solid #00e5ff;
}

/* ===== CATEGORY ===== */

.category-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.category-card{
padding:20px;
border-radius:16px;
background:rgba(255,255,255,0.08);
cursor:pointer;
}

.category-card.active{
border:2px solid #00e5ff;
}

/* ===== BUTTON ===== */

.button-group{
display:flex;
gap:10px;
margin-top:20px;
}

button{
flex:1;
padding:14px;
border:none;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

.btn-next{
background:linear-gradient(90deg,#00e5ff,#0077ff);
color:white;
}

.btn-back{
background:#555;
color:white;
}

/* ===== QRIS ===== */

.qris-box{
text-align:center;
padding:20px;
border:2px dashed #00e5ff;
border-radius:20px;
}

/* ===== SUMMARY ===== */

.summary{
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:16px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>JOGJA QRIStimewa RUN 2026</h1>
<div class="timer-box">Sisa Waktu: <span id="countdown">10:00</span></div>
</div>

<!-- PAGE 1 -->
<div class="page active" id="page1">

<div class="input-group"><label>Nama Lengkap</label><input id="nama"></div>
<div class="input-group"><label>Jenis Kelamin</label>
<select id="gender">
<option value="">Pilih</option>
<option>Laki-Laki</option>
<option>Perempuan</option>
</select>
</div>

<div class="input-group"><label>Tempat Lahir</label><input id="tempat"></div>
<div class="input-group"><label>Tanggal Lahir</label><input type="date" id="tanggal"></div>
<div class="input-group"><label>Umur</label><input id="umur"></div>
<div class="input-group"><label>WhatsApp</label><input id="wa"></div>
<div class="input-group"><label>Email</label><input id="email"></div>
<div class="input-group"><label>Alamat</label><textarea id="alamat"></textarea></div>
<div class="input-group"><label>Kota</label><input id="kota"></div>
<div class="input-group"><label>Nama BIB</label><input id="bib"></div>

<div class="button-group">
<button class="btn-next" onclick="showPage(2)">LANJUT</button>
</div>

</div>

<!-- PAGE 2 -->
<div class="page" id="page2">

<div class="category-grid">

<div class="category-card" onclick="selectCat(this,'5K - 150K')">5K</div>
<div class="category-card" onclick="selectCat(this,'10K - 200K')">10K</div>

</div>

<div class="input-group">
<label>Size Jersey</label>
<select id="size">
<option value="">Pilih</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>
</div>

<div class="button-group">
<button class="btn-back" onclick="showPage(1)">Kembali</button>
<button class="btn-next" onclick="goPayment()">Bayar</button>
</div>

</div>

<!-- PAGE 3 -->
<div class="page" id="page3">

<div class="summary" id="summary"></div>

<div class="qris-box">
<h3>QRIS Pembayaran</h3>
<img src="qris-bayar.png" width="200">
</div>

</div>

</div>

<script>

function showPage(p){
document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
document.getElementById('page'+p).classList.add('active');
}

let category="";

function selectCat(el,val){
document.querySelectorAll('.category-card').forEach(e=>e.classList.remove('active'));
el.classList.add('active');
category=val;
}

function goPayment(){
document.getElementById('summary').innerHTML =
"Nama: "+nama.value+"<br>Category: "+category;
showPage(3);
}

/* TIMER */
let t=600;
setInterval(()=>{
let m=Math.floor(t/60);
let s=t%60;
countdown.innerHTML=`${m}:${s<10?'0':''}${s}`;
t--;
},1000);

</script>

</body>
</html>
